services:
  - type: web
    name: recaply
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.address 0.0.0.0 --server.port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false